# PyTorchJob MNIST GPU Demo
#
# Validates:
#   - Training Operator is running and accepting PyTorchJob resources
#   - GPU scheduling works (nvidia.com/gpu resource allocatable)
#   - CUDA is accessible from within the job pod
#
# Runs a 3-epoch CNN on MNIST using the RTX 4000 Ada (or any CUDA GPU).
# Expected output in pod logs:
#   Using device: cuda
#   GPU: NVIDIA RTX 4000 Ada Generation
#   Epoch 1/3 — avg loss: ~0.18
#   Epoch 2/3 — avg loss: ~0.05
#   Epoch 3/3 — avg loss: ~0.03
#   Test accuracy: ~98.9%
#   SUCCESS: PyTorchJob completed on GPU
#
# Usage:
#   kubectl apply -f pytorchjob.yaml
#   kubectl logs -n kubeflow mnist-gpu-demo-master-0 -f
#   kubectl delete pytorchjob -n kubeflow mnist-gpu-demo

apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: mnist-gpu-demo
  namespace: kubeflow
spec:
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      restartPolicy: OnFailure
      template:
        spec:
          containers:
            - name: pytorch
              image: pytorch/pytorch:2.1.0-cuda12.1-cudnn8-runtime
              command:
                - python
                - -c
                - |
                  import torch
                  import torch.nn as nn
                  import torch.optim as optim
                  from torchvision import datasets, transforms
                  from torch.utils.data import DataLoader

                  device = torch.device("cuda" if torch.cuda.is_available() else "cpu")
                  print(f"Using device: {device}")
                  if torch.cuda.is_available():
                      print(f"GPU: {torch.cuda.get_device_name(0)}")
                      print(f"VRAM: {torch.cuda.get_device_properties(0).total_memory / 1e9:.1f} GB")

                  class Net(nn.Module):
                      def __init__(self):
                          super().__init__()
                          self.conv1 = nn.Conv2d(1, 32, 3)
                          self.conv2 = nn.Conv2d(32, 64, 3)
                          self.fc1   = nn.Linear(9216, 128)
                          self.fc2   = nn.Linear(128, 10)
                      def forward(self, x):
                          x = torch.relu(self.conv1(x))
                          x = torch.relu(self.conv2(x))
                          x = torch.flatten(torch.max_pool2d(x, 2), 1)
                          x = torch.relu(self.fc1(x))
                          return self.fc2(x)

                  transform = transforms.Compose([
                      transforms.ToTensor(),
                      transforms.Normalize((0.1307,), (0.3081,)),
                  ])
                  train_loader = DataLoader(
                      datasets.MNIST('/tmp/data', train=True,  download=True, transform=transform),
                      batch_size=256, shuffle=True,
                  )
                  test_loader = DataLoader(
                      datasets.MNIST('/tmp/data', train=False, download=True, transform=transform),
                      batch_size=1000,
                  )

                  model     = Net().to(device)
                  optimizer = optim.Adam(model.parameters())
                  criterion = nn.CrossEntropyLoss()

                  for epoch in range(1, 4):
                      model.train()
                      total_loss = 0
                      for data, target in train_loader:
                          data, target = data.to(device), target.to(device)
                          optimizer.zero_grad()
                          loss = criterion(model(data), target)
                          loss.backward()
                          optimizer.step()
                          total_loss += loss.item()
                      print(f"Epoch {epoch}/3 — avg loss: {total_loss / len(train_loader):.4f}")

                  model.eval()
                  correct = 0
                  with torch.no_grad():
                      for data, target in test_loader:
                          data, target = data.to(device), target.to(device)
                          correct += model(data).argmax(dim=1).eq(target).sum().item()

                  accuracy = 100.0 * correct / len(test_loader.dataset)
                  print(f"Test accuracy: {accuracy:.2f}%")
                  print("SUCCESS: PyTorchJob completed on GPU" if torch.cuda.is_available() else "SUCCESS: PyTorchJob completed on CPU")
              resources:
                limits:
                  nvidia.com/gpu: "1"
